[project]
name = "ai-agent"
version = "0.1.0"
description = "PMFBY Voice AI Agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "deepgram-sdk>=7.9.0",
    "elevenlabs>=2.68.0",
    "fastapi>=0.141.0",
    "google-genai>=2.24.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.2",
    "openai>=3.16.0",
    "pipecat-ai>=1.11.0",
    "pyaudio>=0.2.14",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "requests>=2.31.0",
    "sarvamai>=0.1.28",
    "supabase>=2.30.0",
    "uvicorn>=0.53.0",
    "websockets>=13.0.0,<16.0.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

